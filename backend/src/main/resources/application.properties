spring.datasource.url=jdbc:mysql://localhost:3306/smart_city_db
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Do not drop tables, just validate them based on our SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 

# Photo upload settings (used by the citizen complaint form's file/camera upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
app.upload.base-url=http://localhost:8080

# Duplicate complaint detection: reports of the same category within this
# radius are merged into a single issue instead of creating a new one
app.duplicate.radius-meters=50

# Reward points: full amount for the original reporter when RESOLVED,
# smaller amount for every citizen whose report got merged as a duplicate
app.reward.original-points=10
app.reward.duplicate-points=4