
name: Build and deploy Smart Civic Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: maven

      - name: Build Spring Boot application
        working-directory: backend
        run: mvn --batch-mode clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: backend/target/*.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: deploy

      - name: Azure login
        uses: azure/login@v2
        with: 
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_779F20FC29D94AF795090FB0719E4F90 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FCA667AE5A7F40D989896E9CB206C484 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_422BA99D15DB4148A2FB8115A79C49F4 }}
          allow-no-subscriptions: true


      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v3
        with:
          app-name: civic-complaint-backend
          package: deploy/*.jar
