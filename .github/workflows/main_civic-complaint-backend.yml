name: Build and deploy JAR app to Azure Web App - Backendcivicmgmt

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build Spring Boot application
        working-directory: backend
        run: mvn --batch-mode clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: deploy

      - name: Deploy to Backendcivicmgmt
        uses: Azure/webapps-deploy@v3
        with:
          app-name: Backendcivicmgmt
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BACKENDCIVICMGMT }}
          package: deploy/*.jar
